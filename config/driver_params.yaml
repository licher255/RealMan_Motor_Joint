whj_driver:
  ros__parameters:
    # CAN interface configuration
    can_interface: "can0"
    
    # Motor IDs and corresponding joint names
    motor_ids: [1, 2, 3, 4, 5, 6]
    joint_names: ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6"]
    
    # Update rate for joint state publishing (Hz)
    update_rate: 50.0
    
    # Position offset in degrees (for zero position adjustment)
    position_offset: 0.0
